<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pierogi na czas</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🥟</text></svg>">
<style>
  html, body { margin: 0; height: 100%; background: #24170f; overflow: hidden; }
  #wrap { position: fixed; inset: 0; background: #24170f; }
  canvas { display: block; width: 100%; height: 100%; object-fit: contain; }
  [hidden] { display: none !important; }
  /* warstwa HTML skalowana razem z canvasem (1280x720) */
  #ui { position: absolute; left: 0; top: 0; width: 1280px; height: 720px; transform-origin: 0 0; pointer-events: none; }
  #lobby { position: absolute; left: 140px; top: 612px; width: 1000px; height: 100px; box-sizing: border-box; pointer-events: auto;
    background: #35251a; border: 2px solid #5b4330; border-radius: 16px; padding: 8px 18px; color: #f1e2c4;
    font: bold 18px "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
    display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 6px; }
  #lobby .row { display: flex; gap: 12px; align-items: center; white-space: nowrap; }
  #lobby button { font: inherit; padding: 7px 16px; border-radius: 10px; border: 0; background: #ffd54a; color: #3a2616; cursor: pointer; }
  #lobby button.ghost { background: transparent; color: #f1e2c4; border: 2px solid #a89a8a; padding: 5px 14px; }
  #lobby input { font: inherit; padding: 6px 10px; border-radius: 10px; border: 2px solid #a89a8a; background: #2b1d14; color: #fff; }
  #codeInput { width: 120px; text-transform: uppercase; text-align: center; letter-spacing: 3px; }
  #roomLink { width: 330px; font-weight: normal; font-size: 15px; }
  #roomCode { font-size: 28px; color: #ffd54a; letter-spacing: 4px; }
  #netStatus { font-size: 16px; min-height: 20px; color: #c9b89f; font-weight: normal; }
</style>
</head>
<body>
<div id="wrap">
<canvas id="game" width="1280" height="720"></canvas>
<div id="ui">
  <div id="lobby">
    <div class="row" id="lobbyLocal">
      <span>🌐 Gra online:</span>
      <button id="btnHost">Załóż pokój</button>
      <span>albo dołącz:</span>
      <input id="codeInput" maxlength="8" placeholder="KOD" autocomplete="off" spellcheck="false">
      <button id="btnJoin">Dołącz</button>
    </div>
    <div class="row" id="lobbyHost" hidden>
      <span>Kod pokoju:</span><span id="roomCode"></span>
      <input id="roomLink" readonly>
      <button id="btnCopy">Kopiuj link</button>
      <button id="btnCloseRoom" class="ghost">Zamknij pokój</button>
    </div>
    <div class="row" id="lobbyGuest" hidden>
      <span id="guestLbl"></span>
      <button id="btnLeave" class="ghost">Rozłącz</button>
    </div>
    <div id="netStatus"></div>
  </div>
</div>
</div>
<script>
(() => {
'use strict';

// ---------------------------------------------------------------- stałe
const W = 1280, H = 720;
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

const ROUND_TIME = 180;          // sekundy
const SPEED = 290;               // px/s
const REACH = 85;                // zasięg akcji przy stacji
const LEP_PRESSES = 12;          // ile naprzemiennych wciśnięć LB/RB
const POT_SIZE = 3;
const CAT_DRAIN = 2;             // punkty tracone co sekundę, gdy kot siedzi przy farszu lub garnku
const CHARGE_SWEEP = 0.7;        // sekundy na jedno przejście wskaźnika siły
const THROW_MIN = 90, THROW_MAX = 700, THROW_SPEED = 600;
const COOK_MIN = 4, PERFECT_FROM = 5.5, PERFECT_TO = 7.5, COOK_OVER = 10;
const FLOOR = { x0: 50, y0: 120, x1: 1230, y1: 630 };
const CAT_DOOR = { x: 640, y: 128 };
const UNCLE_DOOR = { x: 1010, y: 622 };

// pies: kapsuła (odcinek o połowie długości DOG_HALF i promieniu DOG_R), której gracze nie przejdą
const DOG_HALF = 22, DOG_R = 14, PLAYER_R = 26, DOG_SPEED = 150;
const DOG_SCALE = 0.5;           // rysunek psa jest zrobiony w dużej skali i pomniejszany
// miejsca w przejściach; a = kąt ułożenia psa (w poprzek trasy)
const DOG_SPOTS = [
  { x: 1010, y: 375, a: Math.PI / 2, name: 'garnek–stół' },
  { x: 150,  y: 375, a: 0,           name: 'ciasto–farsz' },
  { x: 305,  y: 505, a: Math.PI / 2, name: 'farsz–stolnica' },
  { x: 670,  y: 302, a: Math.atan2(145, 380) + Math.PI / 2,  name: 'stolnica–garnek (góra)' },
  { x: 670,  y: 448, a: Math.atan2(-145, 380) + Math.PI / 2, name: 'stolnica–garnek (dół)' },
];

const ST = {
  dough:  { x: 130,  y: 230, label: 'CIASTO' },
  farsz:  { x: 130,  y: 520, label: 'FARSZ WARZYWNY' },
  board1: { x: 480,  y: 230, label: 'STOLNICA' },
  board2: { x: 480,  y: 520, label: 'STOLNICA' },
  pot:    { x: 860,  y: 375, label: 'GARNEK' },
  plate:  { x: 1160, y: 375, label: 'STÓŁ' },
};

const PLAYER_STYLE = [
  { name: 'Gracz 1', color: '#3b82c4', face: '👦' },
  { name: 'Gracz 2', color: '#d6457a', face: '👧' },
];

const GRANNY = {
  title:   ['Goście za 3 minuty, a pierogów ani widu!'],
  start:   ['No, do roboty! Samo się nie ulepi!', 'Ręce umyte? To lepimy!'],
  serve:   ['No, wreszcie coś na stole.', 'Jeszcze, jeszcze!', 'Tak trzymać, dzieci.', 'Ciocia Krysia zje ze dwadzieścia.'],
  perfect: ['Idealny! Jak moje!', 'O, ten to jak z obrazka!', 'Palce lizać!'],
  combo:   ['Ale tempo! Po babci to macie!', 'Fabryka pierogów, proszę ja ciebie!'],
  drop:    ['Na podłogę?! Za moich czasów…', 'Jedzenia się nie rzuca! No, chyba że celnie.', 'Kto to teraz posprząta?'],
  over:    ['Rozgotowany! Klej, nie pieróg!', 'To już zupa, nie pierogi.'],
  cat:     ['Mruczek! Zostaw ten farsz!', 'Kota pilnować, nie gapić się!'],
  cat2:    ['Łapy precz od garnka!', 'Kot przy garnku! Pilnować!', 'Filemon! Zostaw te pierogi!'],
  catGone: ['A sio, darmozjadzie!'],
  kipi:    ['KIPI! Garnek kipi!', 'Jezus Maria, kuchenka!'],
  kipiBad: ['No i wykipiało. Wszystko rozgotowane.'],
  uncle:   ['Zbyszek! To dla gości!', 'Wujka omijać szerokim łukiem!'],
  uncleIn: ['O, Zbyszek przyszedł „tylko spróbować”…'],
  steal:   ['Nie bijcie się, dla każdego starczy!', 'Ej! Współpraca, a nie podbieranie!'],
  dogIn:   ['Nora! Tylko nie kładź się w przejściu!', 'O, Nora przyszła pilnować pierogów.'],
  dogLie:  ['No i się położyła. W samym przejściu.', 'Nora, serio? Akurat tutaj?', 'Psa się nie przestawia, psa się omija.'],
  dogMove: ['Nora wstaje! Ciekawe, gdzie teraz legnie.', 'Uwaga, Nora zmienia miejscówkę!'],
  flour:   ['Uwaga, mąka na podłodze!', 'Ślisko jak na lodowisku!'],
  slip:    ['Powoli, bo się zabijesz!'],
  trick:   ['Rzut za trzy! Ale w domu się nie rzuca.'],
  idle:    ['Za moich czasów to się lepiło 200 na godzinę.', 'Farszu nie żałować!', 'Ciasto cienko, ale nie za cienko.', 'Kto to widział, tak wolno…'],
  last:    ['Ostatnie 30 sekund! Goście już parkują!'],
};

// ---------------------------------------------------------------- pomocnicze
const rand = (a, b) => a + Math.random() * (b - a);
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

// ---------------------------------------------------------------- stan sieci
// Tryb online: host liczy całą grę, gość wysyła wejścia i dostaje migawki stanu.
const ROOM_PREFIX = 'pierogi-na-czas-';
const SNAP_EVERY = 2;            // host wysyła stan co 2 klatki (ok. 30 razy na sekundę)
const STALE_MS = 3000;           // tyle ciszy = „brak sygnału”
const DROP_MS = 8000;            // tyle ciszy = host uznaje gościa za rozłączonego
const NET_EVENTS = ['a', 'l', 'r', 'start', 'xd', 'xu'];
const net = {
  mode: 'local',                 // 'local' | 'host' | 'guest'
  peer: null, conn: null, code: '', status: '', ready: false, connected: false,
  lastRecv: 0, rtt: null, frame: 0, beeps: [], joinTimer: null, tries: 0,
  inp: { mx: 0, my: 0, xHeld: false, queue: [] },   // host: wejście gościa
  sent: { mx: 0, my: 0, x: false, t: 0 },           // gość: co ostatnio wysłał
};
const netStale = () => net.connected && Date.now() - net.lastRecv > STALE_MS;

// ---------------------------------------------------------------- dźwięk
let AC = null;
function audioInit() {
  try {
    if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)();
    if (AC.state === 'suspended') AC.resume().catch(() => {});
  } catch (e) { /* brak dźwięku to nie tragedia */ }
}
function beep(freq, dur = 0.08, type = 'square', vol = 0.05) {
  if (net.mode === 'host' && net.connected && net.beeps.length < 32) net.beeps.push([freq, dur, type, vol]);
  if (!AC || AC.state !== 'running') return;
  try {
    const o = AC.createOscillator(), g = AC.createGain();
    o.type = type; o.frequency.value = freq;
    g.gain.value = vol;
    g.gain.exponentialRampToValueAtTime(0.0001, AC.currentTime + dur);
    o.connect(g); g.connect(AC.destination);
    o.start(); o.stop(AC.currentTime + dur);
  } catch (e) { /* ignoruj */ }
}

// ---------------------------------------------------------------- wejście
const keys = {};
let startRequested = false;
const KB = [
  { up: 'KeyW', down: 'KeyS', left: 'KeyA', right: 'KeyD', a: 'KeyF', x: 'KeyG', l: 'KeyQ', r: 'KeyE' },
  { up: 'ArrowUp', down: 'ArrowDown', left: 'ArrowLeft', right: 'ArrowRight', a: 'KeyK', x: 'KeyL', l: 'KeyI', r: 'KeyO' },
];
const wrap = document.getElementById('wrap');
const isTyping = e => !!(e.target && e.target.tagName === 'INPUT');
window.addEventListener('keydown', e => {
  audioInit();
  if (isTyping(e)) return;
  keys[e.code] = true;
  if (e.code === 'Enter') startRequested = true;
  if (e.code.startsWith('Arrow') || e.code === 'Space') e.preventDefault();
});
window.addEventListener('keyup', e => { keys[e.code] = false; });
window.addEventListener('pointerdown', audioInit);
canvas.addEventListener('dblclick', () => {
  if (document.fullscreenElement) document.exitFullscreen();
  else if (wrap.requestFullscreen) wrap.requestFullscreen().catch(() => {});
});

function getPads() {
  if (!navigator.getGamepads) return [];
  return Array.from(navigator.getGamepads()).filter(p => p && p.connected);
}

// slot = który zestaw „poprzednich przycisków”, padIdx = który pad, kbs = zestawy klawiszy
const prevBtn = [{}, {}];
function readDevice(slot, padIdx, kbs) {
  const pad = getPads()[padIdx];
  let mx = 0, my = 0, a = false, x = false, l = false, r = false, start = false;
  if (pad) {
    const b = n => !!(pad.buttons[n] && pad.buttons[n].pressed);
    mx = pad.axes[0] || 0; my = pad.axes[1] || 0;
    if (Math.hypot(mx, my) < 0.25) { mx = 0; my = 0; }
    if (b(14)) mx = -1; if (b(15)) mx = 1;
    if (b(12)) my = -1; if (b(13)) my = 1;
    a = b(0); x = b(2) || b(1); l = b(4) || b(6); r = b(5) || b(7); start = b(9);
  }
  for (const k of kbs) {
    if (keys[k.left]) mx = -1; if (keys[k.right]) mx = 1;
    if (keys[k.up]) my = -1; if (keys[k.down]) my = 1;
    a = a || !!keys[k.a]; x = x || !!keys[k.x]; l = l || !!keys[k.l]; r = r || !!keys[k.r];
  }
  const len = Math.hypot(mx, my);
  if (len > 1) { mx /= len; my /= len; }
  const pr = prevBtn[slot];
  const out = { mx, my, a: a && !pr.a, x: x && !pr.x, xHeld: x, l: l && !pr.l, r: r && !pr.r, start: start && !pr.start };
  prevBtn[slot] = { a, x, l, r, start };
  return out;
}

// ---------------------------------------------------------------- stan gry
let S = null;

function mkPlayer(i) {
  return {
    i, x: i === 0 ? 300 : 680, y: 375, vx: 0, vy: 0, fx: i === 0 ? 1 : -1, fy: 0,
    hold: null, lock: null, slide: 0, slideCd: 0, score: 0, charging: false, chargeT: 0,
    name: PLAYER_STYLE[i].name, color: PLAYER_STYLE[i].color, face: PLAYER_STYLE[i].face,
  };
}

// kot: targets = kolejne cele wizyt (na zmianę), gap = przerwa między wizytami, dy = przesunięcie miejsca
function mkCat(face, size, targets, timer, gap, dy) {
  return { face, size, targets, visit: 0, target: targets[0], gap, dy, state: 'away', x: CAT_DOOR.x, y: CAT_DOOR.y, timer, eatT: 0, drainT: 0 };
}

function newGame(phase) {
  S = {
    phase: phase || 'title', t: 0, time: ROUND_TIME, countdown: 3, endT: 0,
    score: 0, streak: 0, lastWarned: false, idleT: rand(14, 22),
    stats: { served: 0, perfect: 0, dropped: 0, over: 0, catPts: 0, potCat: 0, uncle: 0, stolen: 0 },
    players: [mkPlayer(0), mkPlayer(1)],
    boards: [
      { st: ST.board1, user: null, progress: 0, next: null },
      { st: ST.board2, user: null, progress: 0, next: null },
    ],
    pot: { items: [], kipi: false, kipiT: 0, nextKipi: rand(25, 38) },
    cats: [
      mkCat('🐈', 46, ['farsz'], rand(10, 16), [14, 24], 0),
      mkCat('🐱', 40, ['pot'], rand(14, 20), [16, 26], 0),
      mkCat('😼', 40, Math.random() < 0.5 ? ['farsz', 'pot'] : ['pot', 'farsz'], rand(30, 40), [20, 30], -52),
    ],
    uncle: { state: 'away', x: UNCLE_DOOR.x, y: UNCLE_DOOR.y, timer: rand(30, 40), stay: 0, wx: 800, wy: 400, wt: 0 },
    flour: [], nextFlour: rand(15, 24),
    dog: { state: 'away', x: UNCLE_DOOR.x, y: UNCLE_DOOR.y, a: -Math.PI / 2, spot: -1, timer: 0 },
    shots: [], floats: [],
    granny: { text: pick(GRANNY.title), t: 9999 },
  };
}

function say(key, chance = 1) {
  if (Math.random() > chance) return;
  S.granny.text = pick(GRANNY[key]);
  S.granny.t = 3.5;
}

function float(text, x, y, color = '#fff', size = 24) {
  S.floats.push({ text, x, y, color, size, t: 0 });
}

function multiplier() { return S.streak >= 6 ? 3 : S.streak >= 3 ? 2 : 1; }

function penalty(pts, who, text, x, y) {
  S.score -= pts;
  if (who) who.score -= pts;
  S.streak = 0;
  float(`${text} −${pts}`, x, y, '#ff5a4d', 26);
  beep(140, 0.25, 'sawtooth', 0.06);
}

function serve(p, item, bonus) {
  const base = (item.q === 'perfect' ? 15 : 10) + (bonus || 0);
  S.streak++;
  const m = multiplier();
  const pts = base * m;
  S.score += pts; p.score += pts;
  S.stats.served++;
  if (item.q === 'perfect') S.stats.perfect++;
  float(`+${pts}${m > 1 ? ' (x' + m + ')' : ''}`, ST.plate.x, ST.plate.y - 70, item.q === 'perfect' ? '#ffd54a' : '#9cf07a', 30);
  beep(660, 0.08); setTimeout(() => beep(880, 0.12), 80);
  if (S.streak === 3 || S.streak === 6) say('combo');
  else if (item.q === 'perfect') say('perfect', 0.6);
  else say('serve', 0.35);
}

// ---------------------------------------------------------------- akcje gracza
function nearestStation(p) {
  let best = null, bd = REACH;
  for (const key in ST) {
    const d = dist(p, ST[key]);
    if (d < bd) { bd = d; best = key; }
  }
  return best;
}

function stationAction(p, key) {
  const st = ST[key];
  const hint = msg => float(msg, st.x, st.y - 70, '#ffe9b0', 20);
  if (key === 'dough') {
    if (p.hold) return false;
    p.hold = { type: 'dough' }; beep(320, 0.05); return true;
  }
  if (key === 'farsz') {
    if (!p.hold || p.hold.type !== 'dough') { if (!p.hold) hint('Najpierw ciasto!'); return !p.hold; }
    if (S.cats.some(c => c.target === 'farsz' && c.state === 'eating')) { hint('Kot w farszu!'); return true; }
    p.hold = { type: 'filled' }; beep(380, 0.05); return true;
  }
  if (key === 'board1' || key === 'board2') {
    const b = S.boards[key === 'board1' ? 0 : 1];
    if (!p.hold) return false;
    if (p.hold.type !== 'filled') { if (p.hold.type === 'dough') hint('Bez farszu?!'); return p.hold.type === 'dough'; }
    if (b.user) { hint('Zajęte!'); return true; }
    b.user = p; b.progress = 0; b.next = null;
    p.lock = b; p.hold = null; p.x = st.x; p.y = st.y + 58; p.vx = p.vy = 0;
    return true;
  }
  if (key === 'pot') {
    const pot = S.pot;
    if (pot.kipi) {
      pot.kipi = false; pot.nextKipi = rand(22, 36);
      float('Uff, zmniejszone!', st.x, st.y - 80, '#9cf07a'); beep(500, 0.1);
      return true;
    }
    if (p.hold && p.hold.type === 'raw') {
      if (pot.items.length >= POT_SIZE) { hint('Garnek pełny!'); return true; }
      pot.items.push({ t: 0 }); p.hold = null; beep(260, 0.08, 'sine', 0.08);
      return true;
    }
    if (!p.hold) {
      if (!pot.items.length) return false;
      const it = pot.items[0];
      if (it.t < COOK_MIN) { hint('Jeszcze surowe!'); return true; }
      pot.items.shift();
      if (it.t > COOK_OVER) {
        S.stats.over++;
        penalty(5, null, 'Rozgotowany!', st.x, st.y - 80);
        say('over', 0.7);
      } else {
        const q = (it.t >= PERFECT_FROM && it.t <= PERFECT_TO) ? 'perfect' : 'ok';
        p.hold = { type: 'cooked', q };
        if (q === 'perfect') float('IDEALNY!', st.x, st.y - 80, '#ffd54a', 26);
        beep(440, 0.06);
      }
      return true;
    }
    return false;
  }
  if (key === 'plate') {
    if (!p.hold || p.hold.type !== 'cooked') { if (p.hold) hint('Tylko ugotowane!'); return !!p.hold; }
    const item = p.hold; p.hold = null;
    serve(p, item, 0);
    return true;
  }
  return false;
}

function doAction(p) {
  if (p.lock) return;
  for (const cat of S.cats) {
    if ((cat.state === 'coming' || cat.state === 'eating') && dist(p, cat) < 95) {
      cat.state = 'fleeing';
      float('A sio!', cat.x, cat.y - 40, '#fff', 26);
      beep(900, 0.06); say('catGone', 0.5);
      return;
    }
  }
  const key = nearestStation(p);
  if (key && stationAction(p, key)) return;
  const other = S.players[1 - p.i];
  if (!p.hold && other.hold && !other.lock && dist(p, other) < 66) {
    p.hold = other.hold; other.hold = null;
    S.stats.stolen++;
    float('Moje!', p.x, p.y - 60, p.color, 24);
    beep(700, 0.05); say('steal', 0.5);
  }
}

// siła rzutu 0..1: wskaźnik chodzi tam i z powrotem, dopóki trzymasz przycisk
function throwPower(p) {
  const m = (p.chargeT / CHARGE_SWEEP) % 2;
  return m <= 1 ? m : 2 - m;
}
function throwDist(power) { return THROW_MIN + (THROW_MAX - THROW_MIN) * power; }

function doThrow(p, power) {
  if (p.lock || !p.hold) return;
  const life = throwDist(power) / THROW_SPEED;
  S.shots.push({ item: p.hold, x: p.x, y: p.y, vx: p.fx * THROW_SPEED, vy: p.fy * THROW_SPEED, t: 0, life, h: 20 + 45 * power, from: p });
  p.hold = null;
  beep(520, 0.05, 'triangle', 0.06);
}

function landShot(s) {
  const type = s.item.type;
  if (type === 'raw' && dist(s, ST.pot) < 75 && S.pot.items.length < POT_SIZE) {
    S.pot.items.push({ t: 0 });
    float('Chlup! Trafiony!', ST.pot.x, ST.pot.y - 80, '#9cf07a');
    beep(260, 0.08, 'sine', 0.08);
    return;
  }
  if (type === 'cooked' && dist(s, ST.plate) < 80) {
    float('RZUT ZA TRZY! +5', ST.plate.x, ST.plate.y - 105, '#ffd54a', 26);
    serve(s.from, s.item, 5);
    say('trick');
    return;
  }
  if (type === 'dough' || type === 'filled') {
    S.flour.push({ x: s.x, y: s.y, r: 42, ttl: 16 });
    float('Plask!', s.x, s.y - 30, '#fff');
    beep(180, 0.1, 'sawtooth');
    return;
  }
  S.stats.dropped++;
  penalty(5, s.from, 'Na podłogę!', s.x, s.y - 30);
  say('drop', 0.8);
}

// ---------------------------------------------------------------- aktualizacja
function moveTowards(o, tx, ty, speed, dt) {
  const d = Math.hypot(tx - o.x, ty - o.y);
  if (d <= speed * dt) { o.x = tx; o.y = ty; return true; }
  o.x += (tx - o.x) / d * speed * dt;
  o.y += (ty - o.y) / d * speed * dt;
  return false;
}

function updatePlayer(p, inp, dt) {
  if (p.lock) {
    const b = p.lock;
    p.charging = false;
    let hit = false;
    if (inp.l && b.next !== 'r') { b.next = 'r'; hit = true; }
    else if (inp.r && b.next !== 'l') { b.next = 'l'; hit = true; }
    if (hit) {
      b.progress++;
      beep(300 + b.progress * 30, 0.04);
      if (b.progress >= LEP_PRESSES) {
        p.hold = { type: 'raw' };
        p.lock = null; b.user = null; b.progress = 0; b.next = null;
        float('Ulepiony!', b.st.x, b.st.y - 70, '#9cf07a');
      }
    }
    return;
  }
  p.slideCd = Math.max(0, p.slideCd - dt);
  if (p.slide > 0) {
    p.slide -= dt;
    if (p.slide <= 0) p.slideCd = 1.2;
  } else {
    const sp = p.charging ? SPEED * 0.55 : SPEED;
    p.vx = inp.mx * sp; p.vy = inp.my * sp;
    const len = Math.hypot(inp.mx, inp.my);
    if (len > 0.3) { p.fx = inp.mx / len; p.fy = inp.my / len; }
  }
  p.x = clamp(p.x + p.vx * dt, FLOOR.x0 + 26, FLOOR.x1 - 26);
  p.y = clamp(p.y + p.vy * dt, FLOOR.y0 + 30, FLOOR.y1 - 26);

  if (p.slide <= 0 && p.slideCd <= 0 && Math.hypot(p.vx, p.vy) > 80) {
    for (const f of S.flour) {
      if (dist(p, f) < f.r) {
        p.slide = 0.7; p.vx *= 1.4; p.vy *= 1.4;
        float('Łiii!', p.x, p.y - 60, '#fff');
        beep(1000, 0.2, 'sine', 0.05); say('slip', 0.4);
        break;
      }
    }
  }
  if (inp.a) doAction(p);
  // rzut: przytrzymanie ładuje siłę, puszczenie rzuca
  if (!p.hold || p.lock) p.charging = false;
  else if (inp.xHeld) {
    if (!p.charging) { p.charging = true; p.chargeT = 0; }
    else p.chargeT += dt;
  } else if (p.charging) {
    p.charging = false;
    doThrow(p, throwPower(p));
  }
}

function updateShots(dt) {
  for (let i = S.shots.length - 1; i >= 0; i--) {
    const s = S.shots[i];
    s.t += dt;
    s.x = clamp(s.x + s.vx * dt, FLOOR.x0 + 10, FLOOR.x1 - 10);
    s.y = clamp(s.y + s.vy * dt, FLOOR.y0 + 10, FLOOR.y1 - 10);
    let caught = false;
    if (s.t > 0.08) {
      for (const p of S.players) {
        if (p !== s.from && !p.hold && !p.lock && dist(p, s) < 48) {
          p.hold = s.item; caught = true;
          float('Złapane!', p.x, p.y - 60, p.color, 22);
          beep(760, 0.05);
          break;
        }
      }
    }
    if (caught) { S.shots.splice(i, 1); continue; }
    if (s.t >= s.life) { S.shots.splice(i, 1); landShot(s); }
  }
}

function updatePot(dt) {
  const pot = S.pot;
  for (const it of pot.items) it.t += dt;
  if (pot.kipi) {
    pot.kipiT -= dt;
    if (pot.kipiT <= 0) {
      pot.kipi = false; pot.nextKipi = rand(24, 38);
      for (const it of pot.items) it.t = 99;
      float('Wykipiało!', ST.pot.x, ST.pot.y - 80, '#ff5a4d', 26);
      say('kipiBad');
    }
  } else if (pot.items.length) {
    pot.nextKipi -= dt;
    if (pot.nextKipi <= 0) { pot.kipi = true; pot.kipiT = 4.5; say('kipi'); beep(1200, 0.3, 'square', 0.04); }
  }
}

function updateCat(c, dt) {
  const atPot = c.target === 'pot';
  const tx = atPot ? ST.pot.x - 66 : ST.farsz.x + 58, ty = (atPot ? ST.pot.y : ST.farsz.y) + 6 + c.dy;
  if (c.state === 'away') {
    c.timer -= dt;
    if (c.timer <= 0) {
      c.target = c.targets[c.visit++ % c.targets.length];
      c.state = 'coming'; c.x = CAT_DOOR.x; c.y = CAT_DOOR.y;
    }
  } else if (c.state === 'coming') {
    if (moveTowards(c, tx, ty, 125, dt)) { c.state = 'eating'; c.eatT = 2.5; c.drainT = 0; say(atPot ? 'cat2' : 'cat'); }
  } else if (c.state === 'eating') {
    // punkty lecą od pierwszej chwili, niezależnie od tego, czy w garnku są pierogi, czy sama woda
    c.drainT -= dt;
    if (c.drainT <= 0) {
      c.drainT += 1;
      S.score -= CAT_DRAIN; S.stats.catPts += CAT_DRAIN; S.streak = 0;
      float('−' + CAT_DRAIN, c.x + 26, c.y - 30, '#ff5a4d', 24);
      beep(170, 0.07, 'sawtooth', 0.04);
    }
    // kot przy garnku dodatkowo co jakiś czas wyławia pieroga
    c.eatT -= dt;
    if (c.eatT <= 0) {
      c.eatT = 6;
      if (atPot && S.pot.items.length) {
        S.pot.items.shift(); S.stats.potCat++;
        float('Kot wyłowił pieroga!', c.x, c.y - 58, '#ff5a4d', 22);
      }
    }
  } else if (c.state === 'fleeing') {
    if (moveTowards(c, CAT_DOOR.x, CAT_DOOR.y, 420, dt)) { c.state = 'away'; c.timer = rand(c.gap[0], c.gap[1]); }
  }
}

function updateUncle(dt) {
  const u = S.uncle;
  if (u.state === 'away') {
    u.timer -= dt;
    if (u.timer <= 0 && S.time > 20) { u.state = 'in'; u.stay = 14; u.x = UNCLE_DOOR.x; u.y = UNCLE_DOOR.y; u.wt = 0; say('uncleIn'); }
  } else if (u.state === 'in') {
    u.stay -= dt;
    let target = null, bd = 1e9;
    for (const p of S.players) {
      if (p.hold && p.hold.type === 'cooked') {
        const d = dist(p, u);
        if (d < bd) { bd = d; target = p; }
      }
    }
    if (target) {
      moveTowards(u, target.x, target.y, 135, dt);
      if (dist(u, target) < 46) {
        target.hold = null; S.stats.uncle++;
        penalty(10, null, 'Wujek zjadł!', u.x, u.y - 70);
        say('uncle');
        u.state = 'leaving';
      }
    } else {
      u.wt -= dt;
      if (u.wt <= 0) { u.wx = rand(700, 1050); u.wy = rand(230, 520); u.wt = 2.5; }
      moveTowards(u, u.wx, u.wy, 90, dt);
    }
    if (u.stay <= 0 && u.state === 'in') u.state = 'leaving';
  } else if (u.state === 'leaving') {
    if (moveTowards(u, UNCLE_DOOR.x, UNCLE_DOOR.y, 160, dt)) { u.state = 'away'; u.timer = rand(28, 42); }
  }
}

// pies wchodzi na początku rundy, kładzie się w przejściu i co 60–90 s przenosi się w inne
function updateDog(dt) {
  const d = S.dog;
  if (d.state === 'away') {
    d.spot = Math.floor(Math.random() * DOG_SPOTS.length);
    d.state = 'walking'; d.x = UNCLE_DOOR.x; d.y = UNCLE_DOOR.y;
    say('dogIn');
  } else if (d.state === 'walking') {
    const sp = DOG_SPOTS[d.spot];
    if (Math.hypot(sp.x - d.x, sp.y - d.y) > 1) d.a = Math.atan2(sp.y - d.y, sp.x - d.x);
    if (moveTowards(d, sp.x, sp.y, DOG_SPEED, dt)) {
      d.state = 'lying'; d.a = sp.a; d.timer = rand(60, 90);
      say('dogLie');
    }
  } else if (d.state === 'lying') {
    d.timer -= dt;
    if (d.timer <= 0) {
      let next = Math.floor(Math.random() * (DOG_SPOTS.length - 1));
      if (next >= d.spot) next++;
      d.spot = next; d.state = 'walking';
      say('dogMove');
    }
  }
}

// leżącego psa nie da się przejść: wypychamy gracza poza kapsułę
function dogBlock(p) {
  const d = S.dog;
  if (d.state !== 'lying' || p.lock) return;
  const ax = Math.cos(d.a), ay = Math.sin(d.a);
  const t = clamp((p.x - d.x) * ax + (p.y - d.y) * ay, -DOG_HALF, DOG_HALF);
  const cx = d.x + ax * t, cy = d.y + ay * t;
  let dx = p.x - cx, dy = p.y - cy, dd = Math.hypot(dx, dy);
  const min = DOG_R + PLAYER_R;
  if (dd >= min) return;
  if (dd < 0.01) { dx = -ay; dy = ax; dd = 1; }
  const nx = cx + dx / dd * min, ny = cy + dy / dd * min;
  const qx = clamp(nx, FLOOR.x0 + PLAYER_R, FLOOR.x1 - PLAYER_R), qy = clamp(ny, FLOOR.y0 + 30, FLOOR.y1 - PLAYER_R);
  p.x = qx; p.y = qy;
  // pies przy ścianie: zamiast wciskać gracza w ścianę, zsuwamy go wzdłuż niej poza psa
  if (qx !== nx) {
    const rem = Math.sqrt(Math.max(0, min * min - (qx - cx) * (qx - cx)));
    p.y = clamp(cy + (dy >= 0 ? rem : -rem), FLOOR.y0 + 30, FLOOR.y1 - PLAYER_R);
  } else if (qy !== ny) {
    const rem = Math.sqrt(Math.max(0, min * min - (qy - cy) * (qy - cy)));
    p.x = clamp(cx + (dx >= 0 ? rem : -rem), FLOOR.x0 + PLAYER_R, FLOOR.x1 - PLAYER_R);
  }
  if (p.slide > 0) { p.slide = 0; p.slideCd = 1.2; }
}

function updateFlour(dt) {
  for (let i = S.flour.length - 1; i >= 0; i--) {
    S.flour[i].ttl -= dt;
    if (S.flour[i].ttl <= 0) S.flour.splice(i, 1);
  }
  S.nextFlour -= dt;
  if (S.nextFlour <= 0) {
    S.nextFlour = rand(16, 26);
    if (S.flour.length < 4) {
      S.flour.push({ x: rand(250, 1050), y: rand(200, 560), r: 46, ttl: 20 });
      say('flour', 0.6);
    }
  }
}

function separatePlayers() {
  const [a, b] = S.players;
  const d = dist(a, b);
  if (d >= 50 || d === 0) return;
  const nx = (b.x - a.x) / d, ny = (b.y - a.y) / d, push = 50 - d;
  const wa = a.lock ? 0 : b.lock ? 1 : 0.5, wb = b.lock ? 0 : a.lock ? 1 : 0.5;
  a.x -= nx * push * wa; a.y -= ny * push * wa;
  b.x += nx * push * wb; b.y += ny * push * wb;
}

function simulate(dt, inp) {
  const anyStart = startRequested || inp.some(i => i.a || i.start);
  startRequested = false;
  S.t += dt;
  S.granny.t -= dt;
  for (let i = S.floats.length - 1; i >= 0; i--) {
    const f = S.floats[i];
    f.t += dt; f.y -= 40 * dt;
    if (f.t > 1.3) S.floats.splice(i, 1);
  }

  if (S.phase === 'title') {
    // online host startuje dopiero, gdy druga osoba jest połączona
    if (anyStart && (net.mode !== 'host' || net.connected)) { audioInit(); newGame('countdown'); }
    return;
  }
  if (S.phase === 'countdown') {
    S.countdown -= dt;
    if (S.countdown <= 0) { S.phase = 'play'; say('start'); beep(880, 0.3); }
    return;
  }
  if (S.phase === 'end') {
    S.endT += dt;
    if (S.endT > 2 && anyStart) newGame('countdown');
    return;
  }

  // --- rozgrywka
  S.time -= dt;
  if (S.time <= 30 && !S.lastWarned) { S.lastWarned = true; say('last'); }
  S.idleT -= dt;
  if (S.idleT <= 0) { S.idleT = rand(14, 22); if (S.granny.t <= 0) say('idle'); }

  S.players.forEach((p, i) => updatePlayer(p, inp[i], dt));
  separatePlayers();
  S.players.forEach(dogBlock);
  updateShots(dt);
  updatePot(dt);
  S.cats.forEach(c => updateCat(c, dt));
  updateUncle(dt);
  updateFlour(dt);
  updateDog(dt);

  if (S.time <= 0) {
    S.time = 0; S.phase = 'end'; S.endT = 0;
    beep(440, 0.2); setTimeout(() => beep(330, 0.4), 200);
  }
}

// ---------------------------------------------------------------- sieć: migawki stanu
const r1 = v => Math.round(v * 10) / 10, r2 = v => Math.round(v * 100) / 100;

function snapshot() {
  return {
    phase: S.phase, t: r2(S.t), time: r2(S.time), countdown: r2(S.countdown), endT: r2(S.endT),
    score: S.score, streak: S.streak, stats: S.stats,
    players: S.players.map(p => ({
      x: r1(p.x), y: r1(p.y), fx: r2(p.fx), fy: r2(p.fy), hold: p.hold,
      lock: p.lock ? S.boards.indexOf(p.lock) : -1, slide: r2(Math.max(0, p.slide)),
      charging: p.charging, chargeT: r2(p.chargeT), score: p.score,
    })),
    boards: S.boards.map(b => ({ user: b.user ? b.user.i : -1, progress: b.progress, next: b.next })),
    pot: { items: S.pot.items.map(it => r2(it.t)), kipi: S.pot.kipi },
    cats: S.cats.map(c => ({ state: c.state, target: c.target, x: r1(c.x), y: r1(c.y) })),
    uncle: { state: S.uncle.state, x: r1(S.uncle.x), y: r1(S.uncle.y) },
    dog: { state: S.dog.state, x: r1(S.dog.x), y: r1(S.dog.y), a: r2(S.dog.a) },
    flour: S.flour.map(f => ({ x: r1(f.x), y: r1(f.y), r: f.r, ttl: r2(f.ttl) })),
    shots: S.shots.map(s => ({ item: s.item, x: r1(s.x), y: r1(s.y), vx: r1(s.vx), vy: r1(s.vy), t: r2(s.t), life: r2(s.life), h: r1(s.h) })),
    floats: S.floats.map(f => ({ text: f.text, x: r1(f.x), y: r1(f.y), color: f.color, size: f.size, t: r2(f.t) })),
    granny: { text: S.granny.text, t: r2(Math.min(S.granny.t, 99)) },
  };
}

// gość: cel ruchu trafia do tx/ty, a pozycja na ekranie płynnie go dogania
function setTarget(o, x, y, snap) {
  o.tx = x; o.ty = y;
  if (snap || Math.hypot(o.x - x, o.y - y) > 160) { o.x = x; o.y = y; }
}

function applySnapshot(d) {
  S.phase = d.phase; S.t = d.t; S.time = d.time; S.countdown = d.countdown; S.endT = d.endT;
  S.score = d.score; S.streak = d.streak; Object.assign(S.stats, d.stats);
  d.players.forEach((q, i) => {
    const p = S.players[i];
    setTarget(p, q.x, q.y, false);
    p.fx = q.fx; p.fy = q.fy; p.hold = q.hold; p.lock = q.lock >= 0 ? S.boards[q.lock] : null;
    p.slide = q.slide; p.charging = q.charging; p.chargeT = q.chargeT; p.score = q.score;
  });
  d.boards.forEach((q, i) => {
    const b = S.boards[i];
    b.user = q.user >= 0 ? S.players[q.user] : null; b.progress = q.progress; b.next = q.next;
  });
  S.pot.items = d.pot.items.map(t => ({ t })); S.pot.kipi = d.pot.kipi;
  d.cats.forEach((q, i) => {
    const c = S.cats[i];
    setTarget(c, q.x, q.y, c.state === 'away');
    c.state = q.state; c.target = q.target;
  });
  setTarget(S.uncle, d.uncle.x, d.uncle.y, S.uncle.state === 'away');
  S.uncle.state = d.uncle.state;
  if (d.dog) { setTarget(S.dog, d.dog.x, d.dog.y, S.dog.state === 'away'); S.dog.state = d.dog.state; S.dog.a = d.dog.a; }
  S.flour = d.flour; S.shots = d.shots; S.floats = d.floats; S.granny = d.granny;
}

// ---------------------------------------------------------------- sieć: połączenie
const el = {};
['lobby', 'lobbyLocal', 'lobbyHost', 'lobbyGuest', 'btnHost', 'btnJoin', 'btnCopy', 'btnCloseRoom', 'btnLeave',
  'codeInput', 'roomCode', 'roomLink', 'guestLbl', 'netStatus', 'ui'].forEach(id => { el[id] = document.getElementById(id); });

const normCode = v => String(v || '').toLowerCase().replace(/[^a-z0-9]/g, '').slice(0, 8);
function randomCode() {
  const al = 'abcdefghjkmnpqrstuvwxyz23456789';
  let c = '';
  for (let i = 0; i < 5; i++) c += al[Math.floor(Math.random() * al.length)];
  return c;
}
function roomLink() {
  const u = new URL(location.href);
  u.searchParams.set('pokoj', net.code.toUpperCase());
  u.hash = '';
  return u.toString();
}

function uiSync() {
  el.lobbyLocal.hidden = net.mode !== 'local';
  el.lobbyHost.hidden = net.mode !== 'host';
  el.lobbyGuest.hidden = net.mode !== 'guest';
  if (net.mode === 'host') {
    el.roomCode.textContent = net.ready ? net.code.toUpperCase() : '…';
    el.roomLink.value = net.ready ? roomLink() : '';
  }
  if (net.mode === 'guest') el.guestLbl.textContent = 'Pokój ' + net.code.toUpperCase();
  el.netStatus.textContent = net.status;
}

function loadPeerLib() {
  return new Promise((resolve, reject) => {
    if (window.Peer) { resolve(); return; }
    const sc = document.createElement('script');
    sc.src = 'peerjs.min.js';
    sc.onload = () => resolve();
    sc.onerror = () => reject(new Error('peerjs'));
    document.head.appendChild(sc);
  });
}

// domyślnie darmowy broker PeerJS; ?peerhost=…&peerport=… pozwala wskazać własny PeerServer
function peerOptions() {
  const q = new URLSearchParams(location.search);
  const o = { debug: 1 };
  if (q.get('peerhost')) {
    o.host = q.get('peerhost');
    o.port = Number(q.get('peerport') || 443);
    o.path = q.get('peerpath') || '/';
    o.secure = q.get('peersecure') !== '0' && o.port === 443;
  }
  return o;
}

function netReset() {
  if (net.joinTimer) clearTimeout(net.joinTimer);
  const peer = net.peer;
  net.peer = null; net.conn = null;
  if (peer) { try { peer.destroy(); } catch (e) { /* już zamknięty */ } }
  Object.assign(net, { mode: 'local', code: '', ready: false, connected: false, rtt: null, joinTimer: null, frame: 0 });
  net.beeps.length = 0;
  net.inp = { mx: 0, my: 0, xHeld: false, queue: [] };
  net.sent = { mx: 0, my: 0, x: false, t: 0 };
}

// powrót do gry lokalnej (z komunikatem, czemu)
function leaveOnline(msg) {
  const wasGuest = net.mode === 'guest';
  netReset();
  net.status = msg || '';
  if (wasGuest || S.phase !== 'title') newGame('title');
  uiSync();
}

function attachConn(conn) {
  net.conn = conn;
  const opened = () => {
    if (conn !== net.conn || net.connected) return;
    net.connected = true; net.lastRecv = Date.now();
    if (net.joinTimer) { clearTimeout(net.joinTimer); net.joinTimer = null; }
    net.status = net.mode === 'host' ? 'Druga osoba dołączyła. Możecie zaczynać!' : 'Połączono z hostem.';
    uiSync();
  };
  conn.on('open', opened);
  conn.on('data', d => onData(conn, d));
  conn.on('close', () => onConnLost(conn));
  conn.on('error', () => onConnLost(conn));
  if (conn.open) opened();
}

function onConnLost(conn) {
  if (conn !== net.conn) return;
  if (net.mode === 'guest') { leaveOnline('Połączenie z hostem zostało przerwane.'); return; }
  net.conn = null; net.connected = false; net.rtt = null;
  net.inp = { mx: 0, my: 0, xHeld: false, queue: [] };
  net.status = 'Druga osoba się rozłączyła. Może wrócić tym samym linkiem.';
  uiSync();
}

function onData(conn, d) {
  if (conn !== net.conn || !d || typeof d !== 'object') return;
  net.lastRecv = Date.now();
  if (net.mode === 'host') {
    if (d.t === 'i') {
      const n = net.inp;
      n.mx = Number.isFinite(d.mx) ? clamp(d.mx, -1, 1) : 0;
      n.my = Number.isFinite(d.my) ? clamp(d.my, -1, 1) : 0;
      if (Array.isArray(d.ev)) for (const e of d.ev) if (NET_EVENTS.includes(e) && n.queue.length < 120) n.queue.push(e);
      if (Number.isFinite(d.rtt)) net.rtt = d.rtt;
    } else if (d.t === 'ping') {
      try { conn.send({ t: 'pong', c: d.c }); } catch (e) { /* zaraz i tak przyjdzie close */ }
    } else if (d.t === 'bye') {
      onConnLost(conn);
      try { conn.close(); } catch (e) { /* nic */ }
    }
  } else if (net.mode === 'guest') {
    if (d.t === 's') {
      try { applySnapshot(d.s); } catch (e) { /* uszkodzona migawka, następna naprawi */ }
      if (Array.isArray(d.b)) for (const b of d.b) beep(b[0], b[1], b[2], b[3]);
    } else if (d.t === 'pong') {
      if (Number.isFinite(d.c)) net.rtt = Math.max(0, Math.round(Date.now() - d.c));
    } else if (d.t === 'full') {
      leaveOnline('Ten pokój jest już pełny.');
    }
  }
}

async function hostRoom() {
  netReset();
  net.mode = 'host'; net.status = 'Tworzę pokój…'; net.tries = 0;
  uiSync();
  try { await loadPeerLib(); } catch (e) { leaveOnline('Nie udało się wczytać biblioteki sieciowej (peerjs.min.js).'); return; }
  if (net.mode !== 'host') return;
  openHostPeer();
}

function openHostPeer() {
  net.code = randomCode();
  const peer = net.peer = new window.Peer(ROOM_PREFIX + net.code, peerOptions());
  peer.on('open', () => {
    if (peer !== net.peer) return;
    net.ready = true;
    if (!net.connected) net.status = 'Pokój gotowy. Wyślij link albo kod drugiej osobie.';
    uiSync();
  });
  peer.on('connection', conn => {
    if (peer !== net.peer) return;
    if (net.conn && net.connected && !netStale()) {
      // ktoś trzeci: pokój jest dwuosobowy
      conn.on('open', () => { try { conn.send({ t: 'full' }); } catch (e) { /* nic */ } setTimeout(() => conn.close(), 500); });
      return;
    }
    const old = net.conn;
    net.connected = false;
    attachConn(conn);
    if (old) { try { old.close(); } catch (e) { /* nic */ } }
  });
  peer.on('disconnected', () => {
    // utrata serwera pokoi nie przerywa trwającej gry; próbujemy wrócić, żeby dało się dołączyć ponownie
    setTimeout(() => { if (peer === net.peer && !peer.destroyed && peer.disconnected) peer.reconnect(); }, 2000);
  });
  peer.on('error', err => {
    if (peer !== net.peer) return;
    const type = (err && err.type) || 'nieznany';
    if (type === 'unavailable-id' && !net.ready && net.tries++ < 5) {
      net.peer = null;
      try { peer.destroy(); } catch (e) { /* nic */ }
      openHostPeer();
    } else if (!net.ready) {
      leaveOnline('Nie udało się połączyć z serwerem pokoi (' + type + '). Spróbuj ponownie.');
    } else if (type !== 'peer-unavailable') {
      net.status = 'Problem z serwerem pokoi (' + type + '). Trwająca gra działa dalej.';
      uiSync();
    }
  });
}

async function joinRoom(code) {
  code = normCode(code);
  if (!code) { net.status = 'Wpisz kod pokoju.'; uiSync(); return; }
  netReset();
  if (S.phase !== 'title') newGame('title');
  net.mode = 'guest'; net.code = code; net.status = 'Łączę z pokojem…';
  uiSync();
  try { await loadPeerLib(); } catch (e) { leaveOnline('Nie udało się wczytać biblioteki sieciowej (peerjs.min.js).'); return; }
  if (net.mode !== 'guest' || net.code !== code) return;
  const peer = net.peer = new window.Peer(peerOptions());
  peer.on('open', () => {
    if (peer !== net.peer) return;
    attachConn(peer.connect(ROOM_PREFIX + code, { reliable: true, serialization: 'json' }));
    net.joinTimer = setTimeout(() => {
      if (peer === net.peer && !net.connected) leaveOnline('Nie udało się połączyć z pokojem ' + code.toUpperCase() + '. Wasze sieci mogą blokować połączenie bezpośrednie.');
    }, 20000);
  });
  peer.on('error', err => {
    if (peer !== net.peer) return;
    const type = (err && err.type) || 'nieznany';
    if (type === 'peer-unavailable') leaveOnline('Nie ma pokoju o kodzie ' + code.toUpperCase() + '. Sprawdź kod albo poproś o nowy link.');
    else if (!net.connected) leaveOnline('Nie udało się połączyć (' + type + '). Spróbuj ponownie.');
  });
}

// ---------------------------------------------------------------- sieć: klatka hosta i gościa
// host: wejście gościa na tę klatkę; zdarzenia przycisków idą z kolejki, jedno na klatkę, w kolejności
function netInputFrame() {
  const n = net.inp;
  const out = { mx: 0, my: 0, a: false, x: false, xHeld: false, l: false, r: false, start: false };
  if (!net.connected || netStale()) { n.queue.length = 0; n.xHeld = false; return out; }
  const ev = n.queue.shift();
  if (ev === 'xd') n.xHeld = true;
  else if (ev === 'xu') n.xHeld = false;
  else if (ev) out[ev] = true;
  out.mx = n.mx; out.my = n.my; out.xHeld = n.xHeld;
  return out;
}

function hostSend() {
  const c = net.conn;
  if (!net.connected || !c || !c.open) return;
  if (++net.frame % SNAP_EVERY) return;
  if (c.dataChannel && c.dataChannel.bufferedAmount > 200000) return;   // łącze nie nadąża: pomiń migawkę
  try { c.send({ t: 's', s: snapshot(), b: net.beeps.splice(0) }); } catch (e) { /* close przyjdzie osobno */ }
}

function guestSend(li) {
  const c = net.conn;
  if (!net.connected || !c || !c.open) return;
  const now = Date.now(), st = net.sent, ev = [];
  if (li.a) ev.push('a');
  if (li.l) ev.push('l');
  if (li.r) ev.push('r');
  if (li.start || startRequested) ev.push('start');
  if (li.xHeld !== st.x) { ev.push(li.xHeld ? 'xd' : 'xu'); st.x = li.xHeld; }
  const mx = r2(li.mx), my = r2(li.my);
  try {
    if (ev.length || mx !== st.mx || my !== st.my || now - st.t > 400) {
      c.send({ t: 'i', mx, my, ev, rtt: net.rtt });
      st.mx = mx; st.my = my; st.t = now;
    }
  } catch (e) { /* close przyjdzie osobno */ }
}

// gość: ping co sekundę z timera (działa też w karcie w tle), mierzy opóźnienie i daje znak życia
setInterval(() => {
  const c = net.conn;
  if (net.mode !== 'guest' || !net.connected || !c || !c.open) return;
  try { c.send({ t: 'ping', c: Date.now() }); } catch (e) { /* nic */ }
}, 1000);
// gość zamyka kartę: daj znać hostowi od razu, zamiast czekać na timeout
window.addEventListener('pagehide', () => {
  const c = net.conn;
  if (net.mode === 'guest' && c && c.open) { try { c.send({ t: 'bye' }); } catch (e) { /* nic */ } }
});

// gość nie liczy gry: wysyła wejście i wygładza obraz między migawkami
function guestFrame(dt) {
  guestSend(readDevice(0, 0, KB));
  startRequested = false;
  S.t += dt;
  S.granny.t -= dt;
  if (S.phase === 'play') S.time = Math.max(0, S.time - dt);
  if (S.phase === 'countdown') S.countdown -= dt;
  if (S.phase === 'end') S.endT += dt;
  const k = 1 - Math.exp(-dt * 18);
  for (const o of [...S.players, ...S.cats, S.uncle, S.dog]) {
    if (o.tx === undefined) continue;
    o.x += (o.tx - o.x) * k; o.y += (o.ty - o.y) * k;
  }
  for (const p of S.players) if (p.charging) p.chargeT += dt;
  for (const it of S.pot.items) it.t += dt;
  for (const s of S.shots) {
    if (s.t >= s.life) continue;
    s.t += dt;
    s.x = clamp(s.x + s.vx * dt, FLOOR.x0 + 10, FLOOR.x1 - 10);
    s.y = clamp(s.y + s.vy * dt, FLOOR.y0 + 10, FLOOR.y1 - 10);
  }
  for (const f of S.floats) { f.t += dt; f.y -= 40 * dt; }
}

function update(dt) {
  if (net.mode === 'guest') { guestFrame(dt); return; }
  if (net.mode === 'host') {
    if (net.connected && Date.now() - net.lastRecv > DROP_MS) {
      const c = net.conn;
      onConnLost(c);
      try { c.close(); } catch (e) { /* nic */ }
    }
    simulate(dt, [readDevice(0, 0, KB), netInputFrame()]);
    hostSend();
    return;
  }
  simulate(dt, [readDevice(0, 0, [KB[0]]), readDevice(1, 1, [KB[1]])]);
}

// ---------------------------------------------------------------- rysowanie
function rr(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function txt(s, x, y, size, color, align, outline) {
  ctx.font = `bold ${size}px "Trebuchet MS", "Segoe UI", system-ui, sans-serif`;
  ctx.textAlign = align || 'center';
  ctx.textBaseline = 'middle';
  if (outline) { ctx.lineWidth = Math.max(3, size / 6); ctx.strokeStyle = outline; ctx.lineJoin = 'round'; ctx.strokeText(s, x, y); }
  ctx.fillStyle = color || '#fff';
  ctx.fillText(s, x, y);
}

function emoji(s, x, y, size) {
  ctx.font = `${size}px "Segoe UI Emoji", "Apple Color Emoji", "Noto Color Emoji", sans-serif`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillStyle = '#000';
  ctx.fillText(s, x, y);
}

// kolory pieroga: [jasny, podstawowy, brzeg]
const PIEROG = {
  raw:     ['#fffdf6', '#f1e4c3', '#c5b185'],
  ok:      ['#fff3cf', '#eac176', '#ab7a30'],
  perfect: ['#fff6bf', '#f6c443', '#b07a16'],
  over:    ['#b9ad98', '#8d8170', '#5d5345'],
};

function drawPierog(x, y, r, kind) {
  const [light, base, edge] = PIEROG[kind] || PIEROG.ok;
  const cy = y + r * 0.35;
  // cień
  ctx.fillStyle = 'rgba(0,0,0,0.2)';
  ctx.beginPath(); ctx.ellipse(x + 1, cy + r * 0.16, r * 1.05, r * 0.3, 0, 0, Math.PI * 2); ctx.fill();
  // falbanka
  ctx.fillStyle = base; ctx.strokeStyle = edge; ctx.lineWidth = Math.max(1, r * 0.08);
  for (let i = 0; i <= 8; i++) {
    const a = Math.PI + (Math.PI * i) / 8;
    ctx.beginPath(); ctx.arc(x + Math.cos(a) * r, cy + Math.sin(a) * r, r * 0.17, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  }
  // brzuszek
  const g = ctx.createLinearGradient(0, cy - r, 0, cy + r * 0.25);
  g.addColorStop(0, light); g.addColorStop(1, base);
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(x, cy, r * 0.97, Math.PI, 0);
  ctx.quadraticCurveTo(x, cy + r * 0.34, x - r * 0.97, cy);
  ctx.closePath(); ctx.fill(); ctx.stroke();
  // szew wzdłuż falbanki i połysk
  ctx.strokeStyle = edge; ctx.globalAlpha *= 0.45; ctx.lineWidth = Math.max(1, r * 0.07);
  ctx.beginPath(); ctx.arc(x, cy, r * 0.74, Math.PI * 1.08, Math.PI * 1.92); ctx.stroke();
  ctx.globalAlpha /= 0.45;
  ctx.strokeStyle = 'rgba(255,255,255,0.75)'; ctx.lineWidth = Math.max(1, r * 0.12); ctx.lineCap = 'round';
  ctx.beginPath(); ctx.arc(x, cy, r * 0.5, Math.PI * 1.15, Math.PI * 1.4); ctx.stroke();
  ctx.lineCap = 'butt';
}

function drawSparkle(x, y, r) {
  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.moveTo(x, y - r); ctx.quadraticCurveTo(x, y, x + r, y); ctx.quadraticCurveTo(x, y, x, y + r);
  ctx.quadraticCurveTo(x, y, x - r, y); ctx.quadraticCurveTo(x, y, x, y - r);
  ctx.fill();
}

function drawItem(item, x, y, scale) {
  const k = scale || 1;
  if (item.type === 'dough' || item.type === 'filled') {
    // krążek ciasta
    ctx.fillStyle = 'rgba(0,0,0,0.18)'; ctx.beginPath(); ctx.ellipse(x + 1, y + 3 * k, 16 * k, 14 * k, 0, 0, Math.PI * 2); ctx.fill();
    const g = ctx.createRadialGradient(x - 5 * k, y - 5 * k, 2 * k, x, y, 16 * k);
    g.addColorStop(0, '#fffaf0'); g.addColorStop(1, '#ecdcb4');
    ctx.fillStyle = g; ctx.strokeStyle = '#c5b185'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(x, y, 15 * k, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    if (item.type === 'filled') {
      // kopczyk warzywnego farszu
      ctx.fillStyle = '#6f9a45'; ctx.strokeStyle = '#4c7030'; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.arc(x, y, 8 * k, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#f28c28'; ctx.beginPath(); ctx.arc(x - 3 * k, y - 2 * k, 2.4 * k, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#d93a2b'; ctx.beginPath(); ctx.arc(x + 3 * k, y + 2 * k, 2 * k, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#e9d9b8'; ctx.beginPath(); ctx.arc(x + 2 * k, y - 4 * k, 2 * k, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#b6e07a'; ctx.beginPath(); ctx.arc(x - 3 * k, y + 4 * k, 1.8 * k, 0, Math.PI * 2); ctx.fill();
    }
  } else if (item.type === 'raw') {
    drawPierog(x, y, 16 * k, 'raw');
  } else {
    const perfect = item.q === 'perfect';
    if (perfect) {
      ctx.fillStyle = 'rgba(255,213,74,0.35)';
      ctx.beginPath(); ctx.arc(x, y, 25 * k, 0, Math.PI * 2); ctx.fill();
    }
    drawPierog(x, y, 16 * k, perfect ? 'perfect' : 'ok');
    // zieleninka i przysmażona cebulka na wierzchu
    const cy = y + 16 * k * 0.35;
    [[-5, -8, '#5f9a3a'], [3, -11, '#c9772b'], [7, -6, '#5f9a3a'], [-1, -5, '#c9772b']].forEach(([dx, dy, col]) => {
      ctx.fillStyle = col; ctx.beginPath(); ctx.arc(x + dx * k, cy + dy * k, 1.5 * k, 0, Math.PI * 2); ctx.fill();
    });
    if (perfect) { drawSparkle(x + 15 * k, y - 12 * k, 6 * k); drawSparkle(x - 16 * k, y - 4 * k, 4 * k); }
  }
}

function drawCounter(st, color) {
  ctx.fillStyle = 'rgba(0,0,0,0.25)'; rr(st.x - 52, st.y - 46, 110, 110, 16); ctx.fill();
  ctx.fillStyle = color; rr(st.x - 55, st.y - 55, 110, 110, 16); ctx.fill();
  ctx.strokeStyle = 'rgba(0,0,0,0.35)'; ctx.lineWidth = 3; ctx.stroke();
  ctx.fillStyle = 'rgba(255,255,255,0.13)'; rr(st.x - 49, st.y - 49, 98, 98, 12); ctx.fill();
  txt(st.label, st.x, st.y + 72, 16, '#fff', 'center', '#3a2616');
}

function drawBackground() {
  ctx.fillStyle = '#5b3a23'; ctx.fillRect(0, 0, W, H);
  // podłoga w szachownicę
  const ts = 60;
  for (let y = FLOOR.y0; y < FLOOR.y1; y += ts) {
    for (let x = FLOOR.x0; x < FLOOR.x1; x += ts) {
      const odd = (((x - FLOOR.x0) / ts) + ((y - FLOOR.y0) / ts)) % 2 === 0;
      ctx.fillStyle = odd ? '#f1e2c4' : '#e3c9a0';
      ctx.fillRect(x, y, Math.min(ts, FLOOR.x1 - x), Math.min(ts, FLOOR.y1 - y));
    }
  }
  ctx.strokeStyle = '#3a2616'; ctx.lineWidth = 6;
  ctx.strokeRect(FLOOR.x0, FLOOR.y0, FLOOR.x1 - FLOOR.x0, FLOOR.y1 - FLOOR.y0);
  // drzwi kota i wujka
  ctx.fillStyle = '#24170f';
  rr(CAT_DOOR.x - 34, FLOOR.y0 - 8, 68, 16, 6); ctx.fill();
  rr(UNCLE_DOOR.x - 44, FLOOR.y1 - 8, 88, 16, 6); ctx.fill();
}

function drawStations() {

  });

function drawFarsz() {
  const x = ST.farsz.x, y = ST.farsz.y;
  drawCounter(ST.farsz, '#b98652');
  // drewniana łyżka (pod miską wystaje trzonek)
  ctx.strokeStyle = '#8a5a2b'; ctx.lineWidth = 7; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(x + 14, y - 14); ctx.lineTo(x + 47, y - 47); ctx.stroke();
  ctx.strokeStyle = '#c98d4f'; ctx.lineWidth = 4;
  ctx.beginPath(); ctx.moveTo(x + 14, y - 14); ctx.lineTo(x + 47, y - 47); ctx.stroke();
  ctx.lineCap = 'butt';
  // ceramiczna miska z niebieskim paskiem
  ctx.fillStyle = 'rgba(0,0,0,0.28)'; ctx.beginPath(); ctx.arc(x + 2, y + 4, 42, 0, Math.PI * 2); ctx.fill();
  const bg = ctx.createRadialGradient(x - 14, y - 14, 6, x, y, 44);
  bg.addColorStop(0, '#fffdf7'); bg.addColorStop(1, '#d8cdb9');
  ctx.fillStyle = bg; ctx.beginPath(); ctx.arc(x, y, 42, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = '#a99d88'; ctx.lineWidth = 2; ctx.stroke();
  ctx.strokeStyle = '#4f7fcf'; ctx.lineWidth = 2.5;
  ctx.beginPath(); ctx.arc(x, y, 38, 0, Math.PI * 2); ctx.stroke();
  // farsz: kapusta ze szpinakiem jako baza
  ctx.save();
  ctx.beginPath(); ctx.arc(x, y, 33, 0, Math.PI * 2); ctx.clip();
  const fg = ctx.createRadialGradient(x - 8, y - 10, 4, x, y, 34);
  fg.addColorStop(0, '#a9cc6a'); fg.addColorStop(1, '#5b8636');
  ctx.fillStyle = fg; ctx.fillRect(x - 34, y - 34, 68, 68);
  // paski kapusty
  ctx.lineCap = 'round'; ctx.lineWidth = 2.5;
  [[-22, -10, 0.5, '#d6ecaa'], [-4, -24, 2.2, '#e3f2c0'], [12, 14, 1.1, '#d6ecaa'], [-16, 16, 2.8, '#c2e08e'],
    [18, -14, 0.2, '#e3f2c0'], [2, 2, 1.7, '#c2e08e'], [-26, 4, 1.3, '#e3f2c0'], [8, 24, 0.3, '#d6ecaa']].forEach(([dx, dy, a, col]) => {
    ctx.strokeStyle = col;
    ctx.beginPath(); ctx.moveTo(x + dx - Math.cos(a) * 7, y + dy - Math.sin(a) * 7);
    ctx.quadraticCurveTo(x + dx + Math.sin(a) * 4, y + dy - Math.cos(a) * 4, x + dx + Math.cos(a) * 7, y + dy + Math.sin(a) * 7); ctx.stroke();
  });
  ctx.lineCap = 'butt';
  // marchewka w kostkę
  [[-14, -18, 0.4], [10, -6, 1.0], [-6, 12, 0.2], [20, 12, 0.7], [-24, 12, 1.2], [4, -22, 0.9]].forEach(([dx, dy, a]) => {
    ctx.save(); ctx.translate(x + dx, y + dy); ctx.rotate(a);
    ctx.fillStyle = '#f28c28'; rr(-4, -4, 8, 8, 2); ctx.fill();
    ctx.strokeStyle = '#c9661a'; ctx.lineWidth = 1; ctx.stroke();
    ctx.restore();
  });
  // pieczarki
  [[14, -20, 0.3], [-20, -2, -0.6], [2, 20, 0.9], [22, 0, -0.2]].forEach(([dx, dy, a]) => {
    ctx.save(); ctx.translate(x + dx, y + dy); ctx.rotate(a);
    ctx.fillStyle = '#efe3cd'; ctx.strokeStyle = '#9a7b55'; ctx.lineWidth = 1.2;
    ctx.beginPath(); ctx.arc(0, 0, 6, Math.PI, 0); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#e3d3b6'; ctx.fillRect(-1.6, 0, 3.2, 5); ctx.strokeRect(-1.6, 0, 3.2, 5);

  });
  // papryka, groszek, kukurydza

  [[-8, -6], [12, 4], [-14, 22], [24, -8], [-2, -14]].forEach(([dx, dy]) => { rr(x + dx - 3, y + dy - 2, 6, 4, 1.5); ctx.fill(); });
  ctx.fillStyle = '#7fd04a';

  ctx.fillStyle = '#ffd94a';
  [[-18, 6], [6, -12], [14, 16], [-4, 28], [26, 6]].forEach(([dx, dy]) => { ctx.beginPath(); ctx.arc(x + dx, y + dy, 2.2, 0, Math.PI * 2); ctx.fill(); });
  ctx.restore();
  ctx.strokeStyle = 'rgba(0,0,0,0.25)'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(x, y, 33, 0, Math.PI * 2); ctx.stroke();
}

function drawBoard(b) {
  const x = b.st.x, y = b.st.y;
  drawCounter(b.st, '#7a5230');
  // deska z uchwytem
  ctx.fillStyle = 'rgba(0,0,0,0.28)'; rr(x - 45, y - 38, 82, 66, 10); ctx.fill();
  const g = ctx.createLinearGradient(0, y - 44, 0, y + 24);
  g.addColorStop(0, '#f3dcae'); g.addColorStop(1, '#d6ae70');
  ctx.fillStyle = g; ctx.strokeStyle = '#a17a42'; ctx.lineWidth = 2;
  rr(x + 30, y - 22, 22, 22, 8); ctx.fill(); ctx.stroke();
  rr(x - 48, y - 44, 82, 66, 10); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#7a5230'; ctx.beginPath(); ctx.arc(x + 43, y - 11, 4, 0, Math.PI * 2); ctx.fill();
  // słoje drewna
  ctx.strokeStyle = 'rgba(150,104,48,0.35)'; ctx.lineWidth = 1.5;
  [-32, -20, -8, 4, 14].forEach((dy, k) => {
    ctx.beginPath(); ctx.moveTo(x - 42, y + dy);
    ctx.quadraticCurveTo(x - 8, y + dy + (k % 2 ? 5 : -5), x + 28, y + dy); ctx.stroke();

function drawPot() {
  const t = S.t, pot = S.pot;
  const x = ST.pot.x, y = ST.pot.y;
  // kuchenka
  drawCounter(ST.pot, '#8b929b');
  ctx.fillStyle = '#23272c'; rr(x - 47, y - 47, 94, 94, 12); ctx.fill();
  ctx.fillStyle = '#c9d0d8';
  [-30, -10, 10, 30].forEach(dx => { ctx.beginPath(); ctx.arc(x + dx, y + 50, 3.5, 0, Math.PI * 2); ctx.fill(); });
  // płomienie palnika
  const hot = pot.kipi ? 1.6 : 1;
  for (let i = 0; i < 14; i++) {
    const a = (i / 14) * Math.PI * 2, fl = (7 + Math.sin(t * 12 + i * 2.1) * 3) * hot;
    const fx = x + Math.cos(a) * 49, fy = y + Math.sin(a) * 49;
    ctx.fillStyle = pot.kipi ? '#ff5a3c' : '#ff9a3c'; ctx.beginPath(); ctx.arc(fx, fy, fl, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#ffe08a'; ctx.beginPath(); ctx.arc(fx, fy, fl * 0.45, 0, Math.PI * 2); ctx.fill();
  }
  const shake = pot.kipi ? Math.sin(t * 60) * 3 : 0;
  const px = x + shake, py = y;
  // uchwyty
  ctx.fillStyle = '#1b1e22';
  rr(px - 68, py - 9, 22, 18, 6); ctx.fill(); rr(px + 46, py - 9, 22, 18, 6); ctx.fill();
  // garnek
  ctx.fillStyle = 'rgba(0,0,0,0.3)'; ctx.beginPath(); ctx.arc(px + 3, py + 5, 50, 0, Math.PI * 2); ctx.fill();
  const mg = ctx.createRadialGradient(px - 18, py - 18, 8, px, py, 54);
  mg.addColorStop(0, '#e3e8ee'); mg.addColorStop(0.6, '#9aa3ad'); mg.addColorStop(1, '#5c646e');
  ctx.fillStyle = mg; ctx.beginPath(); ctx.arc(px, py, 50, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = '#eef2f6'; ctx.lineWidth = 2.5; ctx.stroke();
  ctx.strokeStyle = '#4a5159'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(px, py, 43, 0, Math.PI * 2); ctx.stroke();
  // woda
  const wgr = ctx.createRadialGradient(px - 10, py - 12, 4, px, py, 42);
  if (pot.kipi) { wgr.addColorStop(0, '#ffffff'); wgr.addColorStop(1, '#dfeaf2'); }
  else { wgr.addColorStop(0, '#bfe6f8'); wgr.addColorStop(1, '#4b9ccc'); }
  ctx.fillStyle = wgr; ctx.beginPath(); ctx.arc(px, py, 42, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,0.55)'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.arc(px, py, 34, Math.PI * 1.1, Math.PI * 1.45); ctx.stroke();
  const active = pot.items.length > 0 || pot.kipi;
  if (active) {
    ctx.fillStyle = 'rgba(255,255,255,0.75)';
    const n = pot.kipi ? 14 : 6;
    for (let i = 0; i < n; i++) {
      const a = t * 2 + i * 1.3, r = 8 + ((t * 20 + i * 9) % 30);
      ctx.beginPath(); ctx.arc(px + Math.cos(a) * r, py + Math.sin(a) * r, pot.kipi ? 5 : 3, 0, Math.PI * 2); ctx.fill();
    }
  }
  const slots = [[-20, -12], [20, -12], [0, 20]];
  pot.items.forEach((it, i) => {
    const sx = px + slots[i][0], sy = py + slots[i][1];
    let col = '#b9c0c8', q = null, type = 'raw';
    if (it.t > COOK_OVER) { col = '#ff5a4d'; type = 'cooked'; }
    else if (it.t >= PERFECT_FROM && it.t <= PERFECT_TO) { col = '#ffd54a'; type = 'cooked'; q = 'perfect'; }
    else if (it.t >= COOK_MIN) { col = '#7be06a'; type = 'cooked'; q = 'ok'; }
    if (it.t > COOK_OVER) drawPierog(sx, sy, 13, 'over');
    else drawItem({ type, q }, sx, sy, 0.8);
    ctx.strokeStyle = 'rgba(0,0,0,0.4)'; ctx.lineWidth = 5;
    ctx.beginPath(); ctx.arc(sx, sy, 19, 0, Math.PI * 2); ctx.stroke();
    ctx.strokeStyle = col; ctx.lineWidth = 5;
    ctx.beginPath(); ctx.arc(sx, sy, 19, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * clamp(it.t / COOK_OVER, 0, 1)); ctx.stroke();
  });
  // para
  if (active) {
    for (let i = 0; i < 4; i++) {
      const k = ((t * 0.5 + i * 0.25) % 1);
      ctx.fillStyle = `rgba(255,255,255,${0.4 * (1 - k)})`;
      ctx.beginPath(); ctx.arc(px - 24 + i * 16 + Math.sin(t * 2 + i) * 5, py - 30 - k * 46, 7 + k * 9, 0, Math.PI * 2); ctx.fill();
    }
  }
  if (pot.kipi && Math.floor(t * 6) % 2 === 0) txt('KIPI! Wciśnij A!', x, y - 90, 26, '#ff5a4d', 'center', '#fff');
}

// Nora: złocistoruda sierść, ciemne uszy i maska, siwy pysk, białe łapy, puszysty ogon z jasnym końcem
const NORA = { coat: '#cf8a3e', light: '#e3b877', dark: '#a8662a', ear: '#3a2a22', mask: '#4d3d33', grey: '#d2cbc2', paw: '#f6f1e8', tail: '#ecd3a4', collar: '#e0558a' };

function drawDog() {
  const d = S.dog;
  if (d.state === 'away') return;
  const t = S.t, lying = d.state === 'lying', C = NORA;
  const el = (x, y, rx, ry, rot) => { ctx.beginPath(); ctx.ellipse(x, y, rx, ry, rot || 0, 0, Math.PI * 2); };
  const limb = (x1, y1, x2, y2, w, col) => { ctx.strokeStyle = col; ctx.lineWidth = w; ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke(); };
  ctx.save();
  ctx.translate(d.x, d.y); ctx.rotate(d.a); ctx.scale(DOG_SCALE, DOG_SCALE);
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';

  if (lying) {
    // śpi na boku: wszystkie łapy wyciągnięte w jedną stronę, ogon z tyłu
    const breath = 1 + Math.sin(t * 2) * 0.03;
    ctx.fillStyle = 'rgba(0,0,0,0.2)'; el(0, 14, 84, 46); ctx.fill();
    // ogon
    ctx.strokeStyle = C.coat; ctx.lineWidth = 20;
    ctx.beginPath(); ctx.moveTo(-48, 2); ctx.quadraticCurveTo(-80, 0, -104, 16); ctx.stroke();
    ctx.strokeStyle = C.tail; ctx.lineWidth = 11;
    ctx.beginPath(); ctx.moveTo(-78, 6); ctx.quadraticCurveTo(-92, 9, -104, 16); ctx.stroke();
    // tylne i przednie łapy z białymi skarpetkami
    [[-36, 16, -14, 52], [-22, 18, 8, 60], [28, 16, 46, 54], [38, 12, 66, 44]].forEach(([x1, y1, x2, y2]) => {
      limb(x1, y1, x2, y2, 15, C.dark);
      limb(x1, y1, x2, y2, 12, C.coat);
      const k = 0.72;
      limb(x1 + (x2 - x1) * k, y1 + (y2 - y1) * k, x2, y2, 12, C.paw);
    });
    // tułów
    const bg = ctx.createRadialGradient(-10, -12, 6, 0, 0, 62);
    bg.addColorStop(0, C.light); bg.addColorStop(0.55, C.coat); bg.addColorStop(1, C.dark);
    ctx.fillStyle = bg; el(-4, 0, 56, 30 * breath); ctx.fill();
    ctx.strokeStyle = C.dark; ctx.lineWidth = 2; ctx.stroke();
    ctx.fillStyle = 'rgba(246,226,186,0.55)'; el(6, 17, 30, 8); ctx.fill();   // jaśniejszy brzuch
    // głowa leży w linii tułowia
    ctx.fillStyle = C.coat; el(58, -4, 23, 21); ctx.fill();
    ctx.strokeStyle = C.dark; ctx.lineWidth = 2; ctx.stroke();
    ctx.fillStyle = C.ear; el(48, -18, 15, 10, -0.4); ctx.fill();
    ctx.fillStyle = C.mask; el(73, -2, 14, 12); ctx.fill();
    ctx.fillStyle = C.grey; el(79, 1, 8, 8); ctx.fill();
    ctx.fillStyle = '#1e1410'; el(86, -2, 5, 4.5); ctx.fill();
    ctx.strokeStyle = '#1e1410'; ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.moveTo(61, -11); ctx.quadraticCurveTo(65, -8, 62, -4); ctx.stroke();   // zamknięte oko
  } else {
    // idzie: widok z góry, łapy na zmianę, ogon merda
    const step = Math.sin(t * 12), wag = Math.sin(t * 14);
    ctx.fillStyle = 'rgba(0,0,0,0.2)'; el(2, 8, 78, 36); ctx.fill();
    ctx.strokeStyle = C.coat; ctx.lineWidth = 20;
    ctx.beginPath(); ctx.moveTo(-50, 0); ctx.quadraticCurveTo(-76, wag * 10, -96, wag * 24); ctx.stroke();
    ctx.strokeStyle = C.tail; ctx.lineWidth = 11;
    ctx.beginPath(); ctx.moveTo(-80, wag * 14); ctx.lineTo(-96, wag * 24); ctx.stroke();
    [[36, -24, 1], [36, 24, -1], [-38, -25, -1], [-38, 25, 1]].forEach(([px, py, ph]) => {
      const ox = step * ph * 9;
      ctx.fillStyle = C.coat; el(px + ox, py, 15, 10); ctx.fill();
      ctx.fillStyle = C.paw; el(px + ox + 9, py, 7, 8); ctx.fill();
    });
    const bg = ctx.createRadialGradient(-8, -8, 6, 0, 0, 60);
    bg.addColorStop(0, C.light); bg.addColorStop(0.55, C.coat); bg.addColorStop(1, C.dark);
    ctx.fillStyle = bg; el(-4, 0, 56, 28); ctx.fill();
    ctx.strokeStyle = C.dark; ctx.lineWidth = 2; ctx.stroke();
    ctx.fillStyle = 'rgba(246,226,186,0.35)'; el(-12, 0, 32, 12); ctx.fill();
    // różowa obroża
    ctx.fillStyle = C.collar; el(38, 0, 6, 22); ctx.fill();
    // ciemne klapnięte uszy, głowa, ciemna maska i siwy pysk

    ctx.fillStyle = C.coat; el(58, 0, 23, 22); ctx.fill();
    ctx.strokeStyle = C.dark; ctx.lineWidth = 2; ctx.stroke();
    ctx.fillStyle = C.mask; el(72, 0, 15, 13); ctx.fill();
    ctx.fillStyle = C.mask; el(64, -9, 6, 5); ctx.fill(); el(64, 9, 6, 5); ctx.fill();
    ctx.fillStyle = C.grey; el(79, 0, 9, 8); ctx.fill();

    ctx.fillStyle = '#c8741f'; el(64, -9, 2.8, 2.8); ctx.fill(); el(64, 9, 2.8, 2.8); ctx.fill();
  }
  ctx.restore();
  ctx.lineCap = 'butt'; ctx.lineJoin = 'miter';

      txt('z', d.x + 14 + k * 20 + i * 3, d.y - 26 - k * 26, 12 + k * 9, '#fff', 'center', '#3a2616');

  txt('Nora', d.x, d.y + 34 + 22 * Math.abs(Math.sin(d.a)), 14, '#fff', 'center', '#8a5220');
}

function drawActors() {
  const t = S.t;
  // mąka
  for (const f of S.flour) {
    ctx.globalAlpha = clamp(f.ttl / 2, 0, 1) * 0.85;
    ctx.fillStyle = '#ffffff';
    for (let i = 0; i < 6; i++) {
      const a = i * 1.05;
      ctx.beginPath(); ctx.arc(f.x + Math.cos(a) * f.r * 0.45, f.y + Math.sin(a) * f.r * 0.4, f.r * 0.5, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }
  drawDog();
  // kot
  for (const c of S.cats) {
    if (c.state === 'away') continue;
    const bob = c.state === 'eating' ? Math.sin(t * 14) * 3 : 0;
    ctx.fillStyle = 'rgba(0,0,0,0.2)'; ctx.beginPath(); ctx.ellipse(c.x, c.y + 22, 22, 7, 0, 0, Math.PI * 2); ctx.fill();
    emoji(c.face, c.x, c.y + bob, c.size);
    if (c.state === 'eating') txt(c.target === 'pot' ? 'chlip chlip' : 'mniam mniam', c.x, c.y - 38, 16, '#fff', 'center', '#3a2616');
  }
  // wujek
  const u = S.uncle;
  if (u.state !== 'away') {
    ctx.fillStyle = 'rgba(0,0,0,0.2)'; ctx.beginPath(); ctx.ellipse(u.x, u.y + 30, 30, 9, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#6a8f4e'; ctx.beginPath(); ctx.arc(u.x, u.y, 32, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#3a2616'; ctx.lineWidth = 3; ctx.stroke();
    emoji('👨', u.x, u.y + 2, 40);
    txt('wujek Zbyszek', u.x, u.y - 48, 16, '#fff', 'center', '#3a2616');
  }
  // gracze
  for (const p of S.players) {
    ctx.fillStyle = 'rgba(0,0,0,0.22)'; ctx.beginPath(); ctx.ellipse(p.x, p.y + 26, 26, 8, 0, 0, Math.PI * 2); ctx.fill();
    ctx.save();
    ctx.translate(p.x, p.y);
    if (p.slide > 0) ctx.rotate(Math.sin(t * 30) * 0.5);
    ctx.fillStyle = p.color; ctx.beginPath(); ctx.arc(0, 0, 27, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 3; ctx.stroke();
    emoji(p.face, 0, 2, 34);
    ctx.restore();
    // kierunek
    ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(p.x + p.fx * 36, p.y + p.fy * 36, 5, 0, Math.PI * 2); ctx.fill();
    txt('P' + (p.i + 1), p.x, p.y + 44, 15, '#fff', 'center', p.color);
    if (p.hold) drawItem(p.hold, p.x, p.y - 44, 1);
  }
  // przedmioty w locie
  for (const s of S.shots) {
    const k = Math.sin(Math.PI * clamp(s.t / s.life, 0, 1));
    ctx.fillStyle = 'rgba(0,0,0,0.2)'; ctx.beginPath(); ctx.ellipse(s.x, s.y + 12, 14, 5, 0, 0, Math.PI * 2); ctx.fill();
    drawItem(s.item, s.x, s.y - s.h * k, 1 + 0.5 * k);
  }
  // napisy
  for (const f of S.floats) {
    ctx.globalAlpha = clamp(1.3 - f.t, 0, 1);
    txt(f.text, f.x, f.y, f.size, f.color, 'center', '#2a1a10');
    ctx.globalAlpha = 1;
  }
}

      const lx = clamp(p.x + p.fx * d, FLOOR.x0 + 10, FLOOR.x1 - 10), ly = clamp(p.y + p.fy * d, FLOOR.y0 + 10, FLOOR.y1 - 10);

}

}

function overlay(alpha) {
  ctx.fillStyle = `rgba(30,18,10,${alpha})`; ctx.fillRect(0, 0, W, H);
}

function drawTitle() {
  overlay(0.95);
  emoji('🥟', W / 2 - 330, 92, 70); emoji('🥟', W / 2 + 330, 92, 70);
  txt('PIEROGI NA CZAS', W / 2, 92, 68, '#ffd54a', 'center', '#3a2616');
  txt('Wigilia u babci Halinki. Goście za 3 minuty. Ulepcie i podajcie jak najwięcej pierogów!', W / 2, 160, 23, '#fff');

  const steps = [
    ['1', 'CIASTO', 'weź krążek ciasta (A)'],
    ['2', 'FARSZ', 'nałóż farsz warzywny (A)'],
    ['3', 'STOLNICA', 'lep: na zmianę LB i RB'],
    ['4', 'GARNEK', 'wrzuć (A), wyjmij gdy pierścień złoty'],
    ['5', 'STÓŁ', 'podaj (A): +10, idealny +15'],
  ];
  steps.forEach((s, i) => {
    const y = 214 + i * 40;
    ctx.fillStyle = '#ffd54a'; ctx.beginPath(); ctx.arc(70, y, 15, 0, Math.PI * 2); ctx.fill();
    txt(s[0], 70, y + 1, 18, '#3a2616');
    txt(s[1], 98, y, 21, '#ffd54a', 'left');
    txt(s[2], 225, y, 20, '#fff', 'left');
  });
  const tips = [
    'Trzymaj X = siła rzutu, puść = rzut. Pieróg na podłodze: −5.',
    '3 i 6 podań z rzędu bez wpadki = mnożnik x2 i x3.',
    'Kot przy farszu lub garnku: −2 punkty co sekundę. Przegoń A.',
    'Wujek Zbyszek zjada gotowe pierogi z rąk: −10.',
    'Garnek kipi? Szybko A przy garnku, bo się rozgotują.',
    'Mąka = poślizg. A obok partnera = podkradasz mu z rąk!',
    'Suczka Nora śpi w przejściu. Nie przejdziesz, trzeba ją obejść.',
  ];
  tips.forEach((s, i) => txt('• ' + s, 660, 214 + i * 34, 18, '#f1e2c4', 'left'));

  const pads = getPads();
  const padLine = ok => ok ? '🎮 pad podłączony' : 'pad: brak (naciśnij dowolny przycisk na padzie)';
  const kbBoth = 'klawiatura: WASD lub strzałki, F/K = A, G/L = X, Q/E lub I/O = LB/RB';
  [0, 1].forEach(i => {
    const x = i === 0 ? W / 2 - 300 : W / 2 + 300;
    let name = PLAYER_STYLE[i].face + ' ' + PLAYER_STYLE[i].name, l1, l1ok, l2;
    const me = (net.mode === 'host' && i === 0) || (net.mode === 'guest' && i === 1);
    if (net.mode === 'local') {
      l1ok = !!pads[i]; l1 = padLine(l1ok);
      l2 = i === 0 ? 'klawiatura: WASD, F = A, G = X, Q/E = LB/RB' : 'klawiatura: strzałki, K = A, L = X, I/O = LB/RB';
    } else if (me) {
      name += ' (Ty)'; l1ok = !!pads[0]; l1 = padLine(l1ok); l2 = kbBoth;
    } else {
      name += ' (online)'; l1ok = net.connected && !netStale();
      l1 = l1ok ? '🌐 połączony' + (net.rtt !== null ? ' · ping ' + net.rtt + ' ms' : '') : (net.mode === 'host' ? 'czekam, aż dołączy…' : 'łączenie z hostem…');
      l2 = net.mode === 'host' ? 'gra u siebie, tu widać ruchy na żywo' : 'host liczy grę i wysyła obraz stanu';
    }
    ctx.fillStyle = 'rgba(255,255,255,0.08)'; rr(x - 290, 432, 580, 116, 16); ctx.fill();
    txt(name, x, 460, 26, i === 0 ? '#7fb9ee' : '#f28bb0');
    txt(l1, x, 494, 19, l1ok ? '#9cf07a' : '#c9b89f');
    txt(l2, x, 525, 16, '#c9b89f');
  });
  let prompt = 'Naciśnij A na padzie lub ENTER – gra lokalna';
  if (net.mode === 'host') prompt = !net.ready ? 'Tworzę pokój…' : net.connected ? 'Druga osoba jest online! Naciśnij A lub ENTER' : 'Czekam na drugą osobę…';
  if (net.mode === 'guest') prompt = net.connected ? 'Połączono! A lub ENTER zaczyna grę' : 'Łączę z pokojem…';
  if (Math.floor(S.t * 2) % 2 === 0) txt(prompt, W / 2, 582, 28, '#ffd54a');
}

function rating(score) {
  if (score < 60) return ['Głodni pójdą…', '#ff5a4d'];
  if (score < 160) return ['No, ujdzie w tłoku.', '#f1e2c4'];
  if (score < 300) return ['Dobre dzieci. Zdolne po babci.', '#9cf07a'];
  return ['MOJA KREW!', '#ffd54a'];
}

function drawEnd() {
  overlay(0.93);
  const [rt, rc] = rating(S.score);
  txt('GOŚCIE PRZYSZLI!', W / 2, 90, 60, '#ffd54a', 'center', '#3a2616');
  txt('Wynik drużyny: ' + S.score, W / 2, 170, 44, '#fff');
  emoji('👵', W / 2 - 330, 245, 60);
  txt('„' + rt + '”', W / 2, 245, 40, rc);
  const st = S.stats;
  const rows = [
    ['Podane pierogi', st.served], ['w tym idealne', st.perfect],
    ['Na podłodze', st.dropped], ['Rozgotowane', st.over],
    ['Punkty stracone przez koty', st.catPts], ['Pierogi wyłowione przez kota', st.potCat], ['Zjedzone przez wujka', st.uncle],
    ['Podkradzione partnerowi', st.stolen],
  ];
  rows.forEach((r, i) => {
    const y = 310 + i * 32;
    txt(r[0], W / 2 - 40, y, 22, '#f1e2c4', 'right');
    txt(String(r[1]), W / 2 + 10, y, 22, '#fff', 'left');
  });
  const [a, b] = S.players;
  let fav;
  if (a.score === b.score) fav = 'Ulubiony wnuk: remis. Babcia kocha was po równo (podobno).';
  else {
    const w = a.score > b.score ? a : b;
    fav = `🏆 Ulubiony wnuk babci: ${w.name} (${a.score} : ${b.score})`;
  }
  txt(fav, W / 2, 570, 30, '#ffd54a');
  if (S.endT > 2 && Math.floor(S.t * 2) % 2 === 0) txt('A lub ENTER – jeszcze raz', W / 2, 660, 28, '#fff');
}

function render() {
  drawBackground();
  drawStations();
  drawActors();
  drawHud();
  if (S.phase === 'play') drawCharge();
  if (S.phase === 'title') drawTitle();
  else if (S.phase === 'countdown') {
    overlay(0.45);
    txt(String(Math.max(1, Math.ceil(S.countdown))), W / 2, H / 2, 200, '#ffd54a', 'center', '#3a2616');
    txt('Zakasać rękawy!', W / 2, H / 2 + 140, 36, '#fff', 'center', '#3a2616');
  } else if (S.phase === 'end') drawEnd();
  if (net.mode === 'guest' && S.phase !== 'title' && netStale()) {
    overlay(0.6);
    txt('Brak sygnału od hosta…', W / 2, H / 2, 44, '#ffd54a', 'center', '#3a2616');
    txt('Karta z grą u hosta musi być otwarta i widoczna.', W / 2, H / 2 + 56, 22, '#fff', 'center', '#3a2616');
  }
}

// ---------------------------------------------------------------- pętla
let last = 0, lobbyShown = null;
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000 || 0);
  last = now;
  update(dt);
  render();
  const showLobby = S.phase === 'title';
  if (showLobby !== lobbyShown) { lobbyShown = showLobby; el.lobby.hidden = !showLobby; }
  requestAnimationFrame(frame);
}

newGame('title');
uiSync();
window.__pierogi = { get S() { return S; }, update, render, keys, ST, DOG_SPOTS, net, snapshot, applySnapshot, netInputFrame };
// link z kodem pokoju = od razu dołączamy
const linkCode = normCode(new URLSearchParams(location.search).get('pokoj'));
if (linkCode) joinRoom(linkCode);
requestAnimationFrame(frame);
})();
</script>
